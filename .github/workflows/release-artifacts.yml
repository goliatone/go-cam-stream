name: Versioned release artifacts

# Manual only. No tag creation, pushes, or public release publication.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Shared camera/server version (MAJOR.MINOR.PATCH)
        required: true
        type: string
      runtime_pack_url:
        description: Optional HTTPS mirror override; defaults to the runtime lock URL
        required: false
        type: string
      distribution:
        description: Sign/notarize on hosted macOS using protected secrets (requires vVERSION tag)
        default: false
        type: boolean
      create_draft:
        description: Create a GitHub draft with BOTH signed camera and server assets (never publish)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  camera:
    runs-on: macos-26
    environment: ${{ inputs.distribution && 'camera-release' || 'camera-build' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate version and release source
        env:
          DISTRIBUTION: ${{ inputs.distribution }}
          CREATE_DRAFT: ${{ inputs.create_draft }}
        run: |
          PYTHONPATH=macos python3 - "$RELEASE_VERSION" <<'PY'
          import runpy, sys
          runpy.run_path('macos/package-release.py')['builder']['validate_version'](sys.argv[1])
          PY
          if [ "$CREATE_DRAFT" = true ] && [ "$DISTRIBUTION" != true ]; then
            echo 'Draft releases require notarized distribution artifacts' >&2; exit 1
          fi
          if [ "$DISTRIBUTION" = true ]; then
            test "$(git rev-parse "refs/tags/v$RELEASE_VERSION^{commit}")" = "$(git rev-parse HEAD)"
          fi
      - name: Fetch exact locked runtime
        env:
          RUNTIME_PACK_URL: ${{ inputs.runtime_pack_url }}
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'macos')
          from runtime_pack import load_lock, fetch
          record = dict(load_lock()['packs']['darwin-arm64'])
          if os.environ['RUNTIME_PACK_URL']:
              record['url'] = os.environ['RUNTIME_PACK_URL']
          fetch(record, '.cache/camera-runtime/packs', offline=False)
          PY
      - name: Native and pack checks
        run: |
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'macos')
          from runtime_pack import load_lock, selected_pack, unpack_locked
          lock = load_lock()
          unpack_locked(selected_pack(lock), Path(os.environ['RUNNER_TEMP']) / 'camera-runtime-check', lock)
          PY
          export CAMSTREAM_PREVIEW_RUNTIME="$RUNNER_TEMP/camera-runtime-check/tools"
          python3 -m unittest discover -s macos -p 'test_*.py' -q
          xcrun swiftc -swift-version 5 macos/CameraApp/CameraState.swift macos/CameraApp/HelperClient.swift macos/CameraApp/PreviewReader.swift macos/CameraApp/PreviewController.swift macos/CameraApp/CameraModel.swift macos/CameraAppTests/main.swift -o "$RUNNER_TEMP/camera-tests"
          "$RUNNER_TEMP/camera-tests" "$PWD/macos/CameraAppTests/fake-helper.py"
      - name: Prepare temporary signing Keychain
        if: ${{ inputs.distribution }}
        env:
          CAMERA_CERTIFICATE_P12_BASE64: ${{ secrets.CAMERA_CERTIFICATE_P12_BASE64 }}
          CAMERA_CERTIFICATE_PASSWORD: ${{ secrets.CAMERA_CERTIFICATE_PASSWORD }}
          CAMERA_APPLE_ID: ${{ secrets.CAMERA_APPLE_ID }}
          CAMERA_APP_PASSWORD: ${{ secrets.CAMERA_APP_PASSWORD }}
          CAMERA_TEAM_ID: ${{ vars.CAMERA_TEAM_ID }}
          CAMERA_NOTARY_PROFILE: ${{ vars.CAMERA_NOTARY_PROFILE }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PYTHON'
          import base64, os
          from pathlib import Path
          required = ('CAMERA_CERTIFICATE_P12_BASE64', 'CAMERA_CERTIFICATE_PASSWORD',
                      'CAMERA_APPLE_ID', 'CAMERA_APP_PASSWORD', 'CAMERA_TEAM_ID', 'CAMERA_NOTARY_PROFILE')
          for name in required:
              if not os.environ.get(name):
                  raise SystemExit('Missing protected signing input: ' + name)
          try:
              cert = base64.b64decode(os.environ['CAMERA_CERTIFICATE_P12_BASE64'], validate=True)
          except ValueError:
              raise SystemExit('Invalid certificate base64') from None
          (Path(os.environ['RUNNER_TEMP']) / 'camera-signing.p12').write_bytes(cert)
          PYTHON
          camera_keychain="$RUNNER_TEMP/camera-signing.keychain-db"
          camera_keychain_password=$(openssl rand -hex 32)
          security create-keychain -p "$camera_keychain_password" "$camera_keychain"
          security set-keychain-settings -lut 7200 "$camera_keychain"
          security unlock-keychain -p "$camera_keychain_password" "$camera_keychain"
          security import "$RUNNER_TEMP/camera-signing.p12" -P "$CAMERA_CERTIFICATE_PASSWORD" \
            -t cert -f pkcs12 -k "$camera_keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$camera_keychain_password" "$camera_keychain" >/dev/null
          security list-keychains -d user -s "$camera_keychain"
          xcrun notarytool store-credentials "$CAMERA_NOTARY_PROFILE" \
            --keychain "$camera_keychain" --apple-id "$CAMERA_APPLE_ID" \
            --team-id "$CAMERA_TEAM_ID" --password "$CAMERA_APP_PASSWORD"
          rm -f "$RUNNER_TEMP/camera-signing.p12"
      - name: Assemble DMG
        env:
          DISTRIBUTION: ${{ inputs.distribution }}
          CAMERA_SIGN_IDENTITY: ${{ vars.CAMERA_SIGN_IDENTITY }}
          CAMERA_NOTARY_PROFILE: ${{ vars.CAMERA_NOTARY_PROFILE }}
        run: |
          if [ "$DISTRIBUTION" = true ]; then
            # Secrets are provisioned only in the protected camera-release environment.
            test -n "$CAMERA_SIGN_IDENTITY" && test -n "$CAMERA_NOTARY_PROFILE"
            python3 macos/package-release.py "$RELEASE_VERSION" \
              --sign-identity "$CAMERA_SIGN_IDENTITY" --notary-profile "$CAMERA_NOTARY_PROFILE" \
              --notary-keychain "$RUNNER_TEMP/camera-signing.keychain-db" \
              --output "$RUNNER_TEMP/camera-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          else
            python3 macos/package-release.py "$RELEASE_VERSION" --development \
              --output "$RUNNER_TEMP/camera-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
      - name: Remove signing material
        if: ${{ always() && inputs.distribution }}
        run: |
          security delete-keychain "$RUNNER_TEMP/camera-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/camera-signing.p12"
      - name: Retain camera assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: camera-${{ inputs.version }}
          path: |
            ${{ runner.temp }}/camera-release-${{ github.run_id }}-${{ github.run_attempt }}/**/*.dmg
            ${{ runner.temp }}/camera-release-${{ github.run_id }}-${{ github.run_attempt }}/**/release.json
            ${{ runner.temp }}/camera-release-${{ github.run_id }}-${{ github.run_attempt }}/**/SHA256SUMS
            ${{ runner.temp }}/camera-release-${{ github.run_id }}-${{ github.run_attempt }}/**/notary-*.json
          if-no-files-found: error
          retention-days: 14

  server:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate shared version
        run: |
          PYTHONPATH=macos python3 - "$RELEASE_VERSION" <<'PY'
          import runpy, sys
          runpy.run_path('macos/build-proof.py')['validate_version'](sys.argv[1])
          PY
      - name: Build embedded web and pinned Linux package
        run: |
          ./scripts/build-web.sh
          curl --fail --location --retry 3 --max-time 180 \
            https://github.com/AlexxIT/go2rtc/releases/download/v1.9.15/go2rtc_linux_arm64 -o "$RUNNER_TEMP/go2rtc"
          # package.sh verifies the pinned digest before copying/building.
          ./scripts/package.sh "$RELEASE_VERSION" "$RUNNER_TEMP/go2rtc"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ inputs.version }}
          path: |
            dist/camstream-*-linux-arm64.tar.gz
            dist/camstream-*-linux-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  draft:
    if: ${{ inputs.create_draft && inputs.distribution }}
    needs: [camera, server]
    runs-on: ubuntu-24.04-arm
    environment: release-draft
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: assets
          pattern: '*-${{ inputs.version }}'
      - name: Verify release assets and create a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          camera="assets/camera-$RELEASE_VERSION/camstream-camera-$RELEASE_VERSION-darwin-arm64"
          server="assets/server-$RELEASE_VERSION"
          (cd "$camera" && sha256sum -c SHA256SUMS)
          (cd "$server" && sha256sum -c "camstream-$RELEASE_VERSION-linux-arm64.tar.gz.sha256")
          python3 - "$camera/release.json" "$RELEASE_VERSION" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          assert r['version'] == sys.argv[2] and r['distribution'] == 'developer-id-notarized'
          PY
          mv "$camera/release.json" "$camera/camera-release.json"
          sed 's/  release.json$/  camera-release.json/' "$camera/SHA256SUMS" > "$camera/camera-SHA256SUMS"
          (cd "$camera" && sha256sum -c camera-SHA256SUMS)
          # A tag must already exist. Never create a tag or replace release assets.
          gh release create "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Camstream $RELEASE_VERSION" --notes 'Draft: validate downloaded camera on the minimum supported macOS before publication.' \
            "$camera/"*.dmg "$camera/camera-release.json" "$camera/camera-SHA256SUMS" \
            "$server/"*.tar.gz "$server/"*.sha256
