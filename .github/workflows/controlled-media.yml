name: Controlled media

# Enable automatic PR runs only after the first hosted run has been reviewed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: controlled-media-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controlled-media:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare evidence directory
        run: |
          evidence="$RUNNER_TEMP/camstream-controlled-media"
          mkdir "$evidence"
          printf 'CI_EVIDENCE=%s\n' "$evidence" >> "$GITHUB_ENV"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record source and check runtime
        run: |
          mkdir -p "$CI_EVIDENCE"
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'run_id=%s\nattempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            uname -a
            docker version
            docker info --format '{{.OSType}}/{{.Architecture}}'
            timeout --version
            df -h . "$RUNNER_TEMP"
          } > "$CI_EVIDENCE/environment.txt" 2>&1
          case "$(docker info --format '{{.OSType}}/{{.Architecture}}')" in
            linux/aarch64|linux/arm64) ;;
            *) echo 'A native Linux arm64 Docker daemon is required' >&2; exit 1 ;;
          esac

      - name: Run fresh controlled-media validation
        # GNU timeout leaves time for result checks and upload before job timeout.
        timeout-minutes: 30
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 25m \
            ./scripts/controlled-media.sh --fresh --output "$CI_EVIDENCE/media" \
            2>&1 | tee "$CI_EVIDENCE/runner.log"

      - name: Verify result and cleanup
        if: ${{ always() }}
        timeout-minutes: 2
        run: |
          result="$CI_EVIDENCE/media/result.txt"
          if [[ ! -f "$result" ]]; then
            echo 'Controlled-media result missing; validation/cleanup is unverified' >&2
            exit 1
          fi
          {
            echo '### Controlled-media result'
            echo '```text'
            cat "$result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -Fxq 'result=PASS' "$result"
          grep -Fxq 'exit_status=0' "$result"
          grep -Fxq 'cleanup=true' "$result"

      - name: Retain validation evidence
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controlled-media-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/camstream-controlled-media/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
