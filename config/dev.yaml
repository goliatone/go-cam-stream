# Default for ./taskfile dev:serve. The task expands @RUNTIME_DIR@ below to
# this checkout's ignored .cache/dev/runtime directory before loading it.
# On macOS dev:serve generates moving video for this source using FFmpeg.
# --webcam[=INDEX] opts into video-only Mac webcam capture instead.
# Custom configs use their actual sources; default mode opens no capture device.
# camstream-dev uses local HTTP and supplies its fixed developer identity.
# The HTTPS origin/access below apply only if this config is used by camstream.
installation_id: camstream-dev
origin: https://camstream-dev.example.test
listen: 127.0.0.1:8081
backend:
  driver: go2rtc
  executable: /usr/local/bin/go2rtc
  runtime_dir: @RUNTIME_DIR@
  media_address: 127.0.0.1
  candidate_address: 127.0.0.1
  network: tcp+udp
  private_ports: {first: 35000, last: 35099}
  media_ports: {first: 35100, last: 35131}
cameras:
  - id: dev-camera
    name: Development test pattern
    physical_id: dev-camera
    strategy: rtsp
    config:
      host: 127.0.0.1
      port: 8554
      profiles:
        - {id: default, name: Moving test pattern, path: /cam, audio: false}
    streams: [default]
access:
  - login: developer@example.test
    grants:
      - {camera_id: dev-camera, streams: [default], view: true, diagnose: true, reconnect: true}
